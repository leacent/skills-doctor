[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-doctor"
version = "0.1.0"
description = "Local AI agent skills checker that generates best-practice HTML reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "skills-doctor contributors" }
]
keywords = ["ai", "agents", "skills", "codex", "claude", "cursor", "audit", "report"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security"
]
dependencies = []

[project.scripts]
skills-doctor = "skills_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skills_doctor*"]

[tool.setuptools.package-data]
skills_doctor = [
  "resources/skills-doctor/SKILL.md",
  "resources/skills-doctor/references/*.md",
]
